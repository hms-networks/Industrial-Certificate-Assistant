name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1

      - name: Build Linux executable
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/IndustrialCertificateAssistant
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch vetted Windows OpenSSL runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ci-vendor-openssl-4.0.1 `
            --repo "$env:GITHUB_REPOSITORY" `
            --dir vendor\openssl\windows `
            --clobber `
            -p "openssl.exe" -p "libssl-4-x64.dll" -p "libcrypto-4-x64.dll"

      - name: Verify OpenSSL runtime against committed hashes
        shell: pwsh
        run: |
          Set-Location vendor\openssl\windows
          $ok = $true
          foreach ($line in Get-Content SHA256SUMS.txt) {
            if ($line -notmatch '^\s*([0-9a-fA-F]{64})\s+(.+)$') { continue }
            $expected = $Matches[1].ToLower()
            $file = $Matches[2].Trim()
            if ($file -notin @("openssl.exe", "libssl-4-x64.dll", "libcrypto-4-x64.dll")) { continue }
            if (-not (Test-Path $file)) {
              Write-Error "Missing vendored file: $file"
              $ok = $false
              continue
            }
            $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($actual -ne $expected) {
              Write-Error "Hash mismatch for $file. Expected $expected, got $actual"
              $ok = $false
            } else {
              Write-Host "Verified $file"
            }
          }
          if (-not $ok) { throw "OpenSSL runtime verification failed." }

      - name: Build Windows executable
        run: .\build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/IndustrialCertificateAssistant.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="# Version $version" '
            $0 == header { flag=1; next }
            /^# Version/ && flag { flag=0 }
            flag { print }
          ' RELEASE_NOTES.md > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            echo "Industrial Certificate Assistant $version" > release-notes.txt
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/linux-binary/IndustrialCertificateAssistant#IndustrialCertificateAssistant (Linux)" \
            "artifacts/windows-exe/IndustrialCertificateAssistant.exe#IndustrialCertificateAssistant.exe (Windows)" \
            --title "Industrial Certificate Assistant $version" \
            --notes-file release-notes.txt
